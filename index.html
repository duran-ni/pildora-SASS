<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SASS Modular Card - BEM</title>
</head>
<body>

  <article class="c-card">
    <div class="c-card__image-wrapper">
      <img class="c-card__image" src="https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=500" alt="Zapatilla Deportiva Roja">
    </div>
    
    <div class="c-card__content">
      <span class="c-card__tag">Nuevo Lanzamiento</span>
      <h2 class="c-card__title">Sport Sneaker Pro</h2>
      <p class="c-card__description">Calzado deportivo de alto rendimiento diseñado para la máxima comodidad y velocidad diaria.</p>
      
      <div class="c-card__footer">
        <span class="c-card__price">129,99€</span>
        <button class="c-card__button c-card__button--accent">Añadir al carrito</button>
      </div>
    </div>
  </article>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
